<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgeting - Expense Optimizer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@700&display=swap">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: url('https://example.com/background-image.jpg'); /* Replace with your background image URL */
            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .content {
            width: 80%;
            padding: 16px;
            background-color: rgba(255, 255, 255, 0.8); /* White background with slight transparency */
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .headline {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
            color: #2c3e50;
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            font-size: 2.5em;
        }

        .budget-form, .calculator {
            background-color: #d5f4e6;
            padding: 20px;
            border-radius: 8px;
            margin: 20px auto;
            max-width: 800px; /* Increased max-width */
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px; /* Added spacing between elements */
        }

        .budget-table {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .budget-table th, .budget-table td {
            border: 1px solid #ddd;
            padding: 10px; /* Increased padding for better spacing */
            text-align: left;
        }

        .budget-table th {
            background-color: #c94c4c;
            color: white;
        }

        input[type="number"], input[type="date"], select, input[type="text"] {
            width: calc(100% - 22px); /* Full width with padding adjustment */
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px;
            margin-top: 10px;
            background-color: #c94c4c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #b43b3b;
        }

        #otherCategory {
            display: none; /* Initially hidden */
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="headline">
            <h1>Budgeting Page</h1>
        </div>

        <div class="budget-form">
            <h2>Add Budget Item</h2>
            <form id="budgetForm">
                <select id="budgetType" required>
                    <option value="">Select Budget Type</option>
                    <option value="Annual Budget">Annual Budget</option>
                    <option value="Monthly Budget">Monthly Budget</option>
                    <option value="Budget Planner">Budget Planner</option>
                </select>
                <select id="budgetCategory" required>
                    <option value="">Select Category</option>
                    <option value="Rent">Rent</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Groceries">Groceries</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
                <input type="text" id="otherCategory" placeholder="Specify Other Category"> <!-- Input for 'Other' -->
                <input type="text" id="budgetAmount" placeholder="Amount (in Rupees)" required>
                <input type="date" id="budgetDate" required>
                <button type="submit">Add Budget</button>
            </form>
        </div>

        <div class="calculator">
            <h2>Budget Calculator</h2>
            <input type="number" id="calcInput1" placeholder="Enter first number" required>
            <input type="number" id="calcInput2" placeholder="Enter second number" required>
            <div>
                <button onclick="calculate('+')">Add</button>
                <button onclick="calculate('-')">Subtract</button>
                <button onclick="calculate('*')">Multiply</button>
                <button onclick="calculate('/')">Divide</button>
            </div>
            <h3>Result: <span id="calcResult">0</span></h3>
        </div>

        <table class="budget-table">
            <thead>
                <tr>
                    <th>Budget Type</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Reminder</th>
                </tr>
            </thead>
            <tbody id="budgetTableBody">
                <!-- Budget items will be inserted here -->
            </tbody>
        </table>
    </div>

    <script>
        const budgetItems = [];

        document.getElementById('budgetForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const type = document.getElementById('budgetType').value;
            const category = document.getElementById('budgetCategory').value === "Other"
                ? document.getElementById('otherCategory').value
                : document.getElementById('budgetCategory').value;
            const amount = parseFloat(document.getElementById('budgetAmount').value.replace(/,/g, '')); // Remove commas
            const date = document.getElementById('budgetDate').value;

            // Check if the date is within the next week for reminder
            const reminder = checkForReminder(date);

            // Add the new budget item to the budgetItems array
            budgetItems.push({ type, category, amount, date, reminder });
            updateBudgetTable();
            this.reset(); // Reset the form
        });

        document.getElementById('budgetCategory').addEventListener('change', function() {
            const otherCategoryInput = document.getElementById('otherCategory');
            if (this.value === 'Other') {
                otherCategoryInput.style.display = 'block'; // Show input for 'Other'
            } else {
                otherCategoryInput.style.display = 'none'; // Hide input if not 'Other'
                otherCategoryInput.value = ''; // Clear the input
            }
        });

        function checkForReminder(date) {
            const today = new Date();
            const selectedDate = new Date(date);
            const timeDiff = selectedDate - today;
            const dayDiff = timeDiff / (1000 * 3600 * 24); // Convert milliseconds to days

            return dayDiff >= 0 && dayDiff <= 7 ? "Reminder: Upcoming" : ""; // Show reminder if date is within next 7 days
        }

        function updateBudgetTable() {
            const tbody = document.getElementById('budgetTableBody');
            tbody.innerHTML = '';
            budgetItems.forEach(item => {
                const formattedAmount = item.amount.toLocaleString('en-IN'); // Format amount in rupees with commas
                const row = `<tr>
                    <td>${item.type}</td>
                    <td>${item.category}</td>
                    <td>₹${formattedAmount}</td>
                    <td>${item.date}</td>
                    <td>${item.reminder}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // Function to format the amount input with commas
        document.getElementById('budgetAmount').addEventListener('input', function(event) {
            let value = event.target.value.replace(/,/g, '');
            if (!isNaN(value) && value !== '') {
                value = parseInt(value).toLocaleString('en-IN'); // Format with commas
            }
            event.target.value = value;
        });

        function calculate(operator) {
            const input1 = parseFloat(document.getElementById('calcInput1').value);
            const input2 = parseFloat(document.getElementById('calcInput2').value);
            let result;

            switch (operator) {
                case '+':
                    result = input1 + input2;
                    break;
                case '-':
                    result = input1 - input2;
                    break;
                case '*':
                    result = input1 * input2;
                    break;
                case '/':
                    if (input2 !== 0) {
                        result = input1 / input2;
                    } else {
                        result = 'Cannot divide by zero';
                    }
break;
                default:
                    result = 0;
            }

            document.getElementById('calcResult').innerText = result; // Display the result
        }
    </script>
</body>
</html>
