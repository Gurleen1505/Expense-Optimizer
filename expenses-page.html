<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses Page</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@700&display=swap">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            color: #34495e;
        }

        .container {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 1200px;
        }

        .expense-container, .summary-container {
            width: 48%;
            padding: 20px;
            background-color: #d5f4e6;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin: 10px;
        }

        .expense-container form {
            display: flex;
            flex-direction: column;
        }

        .expense-container label {
            margin-top: 10px;
            color: #34495e;
        }

        .expense-container input, .expense-container select, .expense-container button {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
        }

        .expense-container button {
            background-color: #c94c4c;
            color: white;
            border: none;
            cursor: pointer;
        }

        .expense-container button:hover {
            background-color: #34495e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table, th, td {
            border: 1px solid #bdc3c7;
        }

        th, td {
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #c94c4c;
            color: white;
        }

        .reminder-btn {
            padding: 5px 10px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .reminder-btn:hover {
            background-color: #1c5985;
        }

        @media screen and (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .expense-container, .summary-container {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <h1>Expenses Page</h1>

    <div class="container">
        <div class="expense-container">
            <form id="expenseForm">
                <label for="totalAmount">Total Budget (₹):</label>
                <input type="text" id="totalAmount" name="totalAmount" placeholder="Enter total budget" required>

                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required>

                <label for="category">Category:</label>
                <select id="category" name="category" required>
                    <option value="Rent">Rent</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Groceries">Groceries</option>
                    <option value="Transport">Transport</option>
                </select>

                <label for="amount">Amount (₹):</label>
                <input type="text" id="amount" name="amount" placeholder="Enter amount" required>

                <button type="submit">Add Expense</button>
            </form>

            <h3>Remaining Budget: ₹<span id="remainingBudget">0</span></h3>
        </div>

        <div class="summary-container">
            <h2>Expense Summary</h2>
            <div id="chartContainer">
                <canvas id="expenseChart"></canvas>
            </div>
            <table id="expenseTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Amount (₹)</th>
                        <th>Reminder</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows will be added dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
    const ctx = document.getElementById('expenseChart').getContext('2d');
    const colors = [
        'rgba(201, 76, 76, 0.5)',  // Light Red
        'rgba(76, 201, 76, 0.5)',  // Light Green
        'rgba(76, 76, 201, 0.5)',  // Light Blue
        'rgba(201, 201, 76, 0.5)', // Light Yellow
        'rgba(201, 76, 201, 0.5)', // Light Purple
        'rgba(76, 201, 201, 0.5)', // Light Cyan
        'rgba(201, 125, 76, 0.5)'  // Light Orange
    ];

    const expenseChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: [],
            datasets: [{
                label: 'Expenses',
                data: [],
                backgroundColor: [], // Colors will be pushed dynamically
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    document.getElementById('totalAmount').addEventListener('input', function (e) {
        let value = e.target.value.replace(/,/g, '');
        if (!isNaN(value) && value !== '') {
            e.target.value = parseInt(value).toLocaleString('en-IN');
        }
    });

    document.getElementById('amount').addEventListener('input', function (e) {
        let value = e.target.value.replace(/,/g, '');
        if (!isNaN(value) && value !== '') {
            e.target.value = parseInt(value).toLocaleString('en-IN');
        }
    });

    const form = document.getElementById('expenseForm');
    const tableBody = document.getElementById('expenseTable').querySelector('tbody');
    let totalBudget = 0;
    let remainingBudget = 0;
    let reminders = [];

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const totalAmount = parseInt(document.getElementById('totalAmount').value.replace(/,/g, ''));
        const date = document.getElementById('date').value;
        const category = document.getElementById('category').value;
        const amount = parseInt(document.getElementById('amount').value.replace(/,/g, ''));

        if (!isNaN(totalAmount)) {
            totalBudget = totalAmount;
        }

        if (remainingBudget === 0) {
            remainingBudget = totalBudget;
        }

        remainingBudget -= amount;

        const newRow = document.createElement('tr');
        newRow.innerHTML = `
            <td>${date}</td>
            <td>${category}</td>
            <td>₹${amount.toLocaleString('en-IN')}</td>
            <td><button class="reminder-btn" onclick="setReminder('${date}', '${category}')">Set Reminder</button></td>
        `;
        tableBody.appendChild(newRow);

        reminders.push({ date, category });

        const index = expenseChart.data.labels.indexOf(category);
        if (index === -1) {
            expenseChart.data.labels.push(category);
            expenseChart.data.datasets[0].data.push(amount);
            expenseChart.data.datasets[0].backgroundColor.push(colors[expenseChart.data.labels.length % colors.length]);
        } else {
            expenseChart.data.datasets[0].data[index] += amount;
        }
        expenseChart.update();

        document.getElementById('remainingBudget').textContent = remainingBudget.toLocaleString('en-IN');

        form.reset();
    });

    function setReminder(date, category) {
        alert(`Reminder set for ${date} under category ${category}`);
    }

    // Function to check reminders and notify on the due date
    function checkReminders() {
        const currentDate = new Date().toISOString().split('T')[0];
        reminders.forEach(reminder => {
            if (reminder.date === currentDate) {
                alert(`Reminder: You have an expense in the category "${reminder.category}" today!`);
            }
        });
    }

    // Run checkReminders function every day at 9:00 AM (example time)
    setInterval(checkReminders, 86400000);
</script>
